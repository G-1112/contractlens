[project]
name = "contractlens"
version = "0.1.0"
description = "契约眼 — 合同条款风险审查流水线（解析 → 规则/LLM 双引擎判定 → 可视化 → 修订稿）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "pypdf>=4.3",
    "PyYAML>=6.0",
    "openai>=1.40",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    # 测试专用：tests/test_parsers.py 等用它生成带中文文本层的 PDF 夹具。
    # 第十二轮修复：此前未声明 → 全新环境 `pip install -e ".[dev]"` 后
    # 5 个 PDF 相关测试 ModuleNotFoundError（「10 分钟复现」断链）。
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
